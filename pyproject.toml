[project]
name = "lsp-bridge"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "epc>=0.0.5",
    "orjson>=3.10.18",
    "packaging>=25.0",
    "paramiko>=3.5.1",
    "rapidfuzz>=3.13.0",
    "setuptools>=80.9.0",
    "sexpdata>=1.0.2",
    "six>=1.17.0",
    "watchdog>=6.0.0",
]

[tool.ruff]
# The tree still carries old docstrings and code lines up to ~146 columns, so
# E501 is deliberately not part of the gate yet (see REFACTOR.org, stage S2).
line-length = 120
extend-exclude = ["core/pystardict.py"]

[tool.ruff.lint]
# Union of the hard gate and the documentation gate; scripts/check-python.sh
# runs them separately so that "must pass now" stays distinguishable from the
# work list.
select = [
    "E4", "E7", "E9",   # pycodestyle errors that hide bugs
    "E722",             # bare except
    "F",                # pyflakes
    "W291", "W293",     # trailing whitespace
    "D",                # pydocstyle: the docstring gate
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "D100",   # module docstrings: not every core module has one yet
    "D104",   # package __init__
    "D107",   # __init__ docstring (the class docstring usually says enough)
    "D401",   # imperative mood: style pass, not enforced
    "D403",   # first word capitalisation: style pass, not enforced
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"test/*" = ["D", "F401", "F403", "F405"]
